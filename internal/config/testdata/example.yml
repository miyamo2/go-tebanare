# .gotebanare.yml
version: 1

files:                      # include defaults to ["**/*.go"]
  include: ["**/*.go"]
  exclude: ["vendor/**", "third_party/**"]

presets:                    # built-in rules, enabled by name
  - getter
  - noop
  - iferr:                  # "name: settings" changes the preset's settings
      names: [err, "*Err"]

rules:
  # Functions and methods (signature patterns)
  - id: stringer
    description: Skip fmt.Stringer implementations
    func: "func (_) String() string"

  - id: gomock
    description: Mocks generated by gomock
    func: "func (*Mock*) *"
    paths: ["**/mock_*.go"]

  - id: generic-repo-finders
    func: "func (*Repository[_]) Find*(context.Context, ...) (_, error)"

  - id: must
    func: "func Must[T](T, error) T"

  # Statements
  - id: tracing
    stmt:
      kind: [AssignStmt, DeferStmt]
      regex:
        - '^ctx, span := \w+\.Start\(ctx, .+\)$'
        - '^defer span\.End\(\)$'

  # Expressions
  - id: debug-log
    expr:
      kind: CallExpr
      regex: '^(log|slog|logger)\.Debug\w*\('
      not_regex: '(?i)password|token|secret'   # logs that may hold secrets stay in the review
