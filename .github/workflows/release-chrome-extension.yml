name: release-chrome-extension

# Runs ci.yml on the tag packages/chrome-extension/vX.Y.Z and attaches its
# dist.zip to the GitHub release of that tag. A prerelease version such as
# X.Y.Z-rc.1 gets a GitHub prerelease and skips the Chrome Web Store.
# tag-chrome-extension.yml pushes the tag when a push to main raises the
# version in packages/chrome-extension/package.json. A tag pushed by hand
# starts this workflow too.
on:
  push:
    tags: ["packages/chrome-extension/v*"]
  # To retry a failed release, run this workflow on the tag. The version job
  # refuses a branch. A published release is left as it is, since the
  # repository may lock releases (immutable releases).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG_PREFIX: packages/chrome-extension/v

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      notes-start: ${{ steps.check.outputs.notes-start }}
    steps:
      # All tags and origin/main, for the checks below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the tag
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "${GITHUB_REF_NAME#"$TAG_PREFIX"}" = "$GITHUB_REF_NAME" ]; then
            echo "::error::run this workflow on a tag $TAG_PREFIX*, not on $GITHUB_REF"
            exit 1
          fi
          version="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          want="$(jq -r .version packages/chrome-extension/package.json)"
          if [ "$version" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/chrome-extension/package.json version $want"
            exit 1
          fi
          # The same rules as tag-chrome-extension.yml, for a tag pushed by
          # hand: a plain version or a prerelease such as -rc.1, higher than
          # every other release. The script ignores the tag's own version.
          # Tags hold no whitespace, so the list splits into one argument each.
          # shellcheck disable=SC2046
          plan="$(node packages/chrome-extension/scripts/release-version.mjs \
            $(git tag --list "$TAG_PREFIX*" | sed "s|^$TAG_PREFIX||"))"
          echo "$plan"
          # tag-chrome-extension.yml commits this version, without a
          # prerelease suffix, to manifest.json before tagging; a tag pushed
          # by hand needs the same commit.
          want_manifest="$(echo "$plan" | sed -n 's/^manifest-version=//p')"
          manifest="$(jq -r .version packages/chrome-extension/manifest.json)"
          if [ "$manifest" != "$want_manifest" ]; then
            echo "::error::packages/chrome-extension/manifest.json has version $manifest, want $want_manifest"
            exit 1
          fi
          echo "$plan" >> "$GITHUB_OUTPUT"

  # The release ships the dist.zip this CI run built, and only after every
  # CI job passes.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    # The e2e job signs in with the E2E_GH_* secrets.
    secrets: inherit

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      NOTES_START: ${{ needs.version.outputs.notes-start }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: ${{ runner.temp }}/chrome-extension
      - name: Check the package
        working-directory: ${{ runner.temp }}/chrome-extension
        run: |
          # build.mjs moves a prerelease suffix into version_name.
          got="$(unzip -p dist.zip manifest.json | jq -r '.version_name // .version')"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::dist.zip has manifest version $got, want $VERSION"
            exit 1
          fi
      - name: Name the assets
        working-directory: ${{ runner.temp }}/chrome-extension
        run: |
          mkdir assets
          asset="go-tebanare-chrome-extension-v$VERSION.zip"
          cp dist.zip "assets/$asset"
          (cd assets && sha256sum "$asset" > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Create the GitHub release
        working-directory: ${{ runner.temp }}/chrome-extension/assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh creates the release as a draft, uploads the assets, then
          # publishes it, so an immutable release gets its assets before it
          # locks. A retried run finds either a published release, which it
          # leaves alone, or a draft left by a failed run, which it finishes.
          if draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::notice::$GITHUB_REF_NAME is already published"
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
            exit 0
          fi
          # --generate-notes starts at the latest release of any package;
          # start it at the previous Chrome extension tag instead: any
          # earlier release for a prerelease, the previous plain release
          # otherwise. gh marks a prerelease as such and never as latest.
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Chrome extension v$VERSION" \
            --generate-notes \
            "${prerelease[@]}" \
            ${NOTES_START:+--notes-start-tag "$TAG_PREFIX$NOTES_START"}
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/chrome-extension/assets
          if-no-files-found: error

  # Uploads the package to the Chrome Web Store and submits it for review;
  # the store publishes it once the review passes. A prerelease such as
  # X.Y.Z-rc.1 skips it: its manifest version X.Y.Z would use up the version
  # the final release needs, since the store wants a higher one each upload.
  #
  # Disabled until the first upload: the store creates the item from a
  # zip uploaded by hand in the developer dashboard, together with the store
  # listing and the privacy practices, and the API can only update an item
  # that exists. After that, uncomment this job and set up:
  #
  # - the environment "chrome-web-store" in the repository settings
  #   (optionally with required reviewers, to approve each submission);
  # - its variables CWS_PUBLISHER_ID (the publisher ID shown in the developer
  #   dashboard) and CWS_EXTENSION_ID (the item ID);
  # - its secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET, and CWS_REFRESH_TOKEN: an
  #   OAuth client of a Google Cloud project with the Chrome Web Store API
  #   enabled, and a refresh token for the publisher account with the scope
  #   https://www.googleapis.com/auth/chromewebstore.
  #
  # The job calls the Chrome Web Store API v2 (v1.1 is deprecated). Check the
  # requests against https://developer.chrome.com/docs/webstore/using-api
  # before enabling it.
  #
  # publish:
  #   needs: [version, release]
  #   if: needs.version.outputs.prerelease != 'true'
