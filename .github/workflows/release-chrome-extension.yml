name: release-chrome-extension

# Publishes the Chrome Web Store package of the tag
# packages/chrome-extension/vX.Y.Z as an asset of the GitHub release of that
# tag. tag-chrome-extension.yml pushes the tag when the version in
# packages/chrome-extension/package.json changes on main; pushing the tag by
# hand starts this workflow too.
on:
  push:
    tags: ["packages/chrome-extension/v*"]
  # To run a release again by hand: run it on the tag, never on a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG_PREFIX: packages/chrome-extension/v

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against package.json and manifest.json
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "${GITHUB_REF_NAME#"$TAG_PREFIX"}" = "$GITHUB_REF_NAME" ]; then
            echo "::error::run this workflow on a tag $TAG_PREFIX*, not on $GITHUB_REF"
            exit 1
          fi
          version="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
          want="$(jq -r .version packages/chrome-extension/package.json)"
          if [ "$version" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/chrome-extension/package.json version $want"
            exit 1
          fi
          # tag-chrome-extension.yml commits it before tagging.
          manifest="$(jq -r .version packages/chrome-extension/manifest.json)"
          if [ "$manifest" != "$version" ]; then
            echo "::error::packages/chrome-extension/manifest.json has version $manifest, want $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The release ships the dist.zip that this CI run built and tested.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: ${{ runner.temp }}/chrome-extension
      - name: Check the package
        working-directory: ${{ runner.temp }}/chrome-extension
        run: |
          got="$(unzip -p dist.zip manifest.json | jq -r .version)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::dist.zip has manifest version $got, want $VERSION"
            exit 1
          fi
      - name: Name the assets
        working-directory: ${{ runner.temp }}/chrome-extension
        run: |
          mkdir assets
          asset="go-tebanare-chrome-extension-v$VERSION.zip"
          cp dist.zip "assets/$asset"
          (cd assets && sha256sum "$asset" > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Create the GitHub release
        working-directory: ${{ runner.temp }}/chrome-extension/assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes list the changes since the previous release of the Chrome
          # extension, not of another package.
          previous="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG_PREFIX" --jq '.[].ref' \
            | sed "s|^refs/tags/$TAG_PREFIX||" | { grep -E '^[0-9]+(\.[0-9]+)*$' || true; } | sort -V \
            | awk -v v="$VERSION" '$0 == v { print prev; exit } { prev = $0 }')"
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Chrome extension v$VERSION" \
            --generate-notes \
            ${previous:+--notes-start-tag "$TAG_PREFIX$previous"}
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/chrome-extension/assets
          if-no-files-found: error

  # Uploads the package to the Chrome Web Store and submits it for review;
  # the store publishes it once the review passes.
  #
  # Disabled until the first release: the store creates the item from a
  # zip uploaded by hand in the developer dashboard, together with the store
  # listing and the privacy practices, and the API can only update an item
  # that exists. After that, uncomment this job and set up:
  #
  # - the environment "chrome-web-store" in the repository settings
  #   (optionally with required reviewers, to approve each submission);
  # - its variables CWS_PUBLISHER_ID (the publisher ID shown in the developer
  #   dashboard) and CWS_EXTENSION_ID (the item ID);
  # - its secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET, and CWS_REFRESH_TOKEN: an
  #   OAuth client of a Google Cloud project with the Chrome Web Store API
  #   enabled, and a refresh token for the publisher account with the scope
  #   https://www.googleapis.com/auth/chromewebstore.
  #
  # The job calls the Chrome Web Store API v2 (v1.1 is deprecated). Check the
  # requests against https://developer.chrome.com/docs/webstore/using-api
  # before enabling it.
  #
  # publish:
  #   needs: [version, release]
  #   runs-on: ubuntu-latest
  #   environment: chrome-web-store
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: release-assets
  #         path: ${{ runner.temp }}/assets
