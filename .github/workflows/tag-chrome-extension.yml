name: tag-chrome-extension

# When a push to main raises the version in
# packages/chrome-extension/package.json, this workflow commits the same
# version to manifest.json on main and tags that commit
# packages/chrome-extension/vX.Y.Z. The tag push starts
# release-chrome-extension.yml.
#
# Run it by hand to tag the version on main when no push raised it: the
# first release, or a retry after deleting a tag whose release failed.
#
# It pushes with a token of the GitHub App go-tebanare-release (variable
# RELEASE_APP_ID, secret RELEASE_APP_PRIVATE_KEY). The App needs Contents:
# Read and write on this repository and must be allowed to bypass any
# protection of main. A tag pushed with GITHUB_TOKEN would not start
# release-chrome-extension.yml.
on:
  push:
    branches: [main]
    paths: [packages/chrome-extension/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-chrome-extension
  cancel-in-progress: false

env:
  TAG_PREFIX: packages/chrome-extension/v

jobs:
  tag:
    # Forks have no App to push with.
    if: github.repository == 'miyamo2/go-tebanare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # The head of main, not the pushed commit: the manifest commit goes on
      # top of it.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # git push below runs with the App's token.
          token: ${{ steps.app.outputs.token }}
      # Runs before setup-node so a push that left the version unchanged (e.g.
      # a dependency bump in package.json) skips the rest of the job without
      # paying for a Node.js setup.
      - name: Check whether the pushed version changed
        id: diff
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          pkg=packages/chrome-extension/package.json
          pushed="$(git show "$GITHUB_SHA:$pkg" | jq -r .version)"
          before="$( { git show "$BEFORE:$pkg" 2> /dev/null || true; } | jq -r .version)"
          if [ "$pushed" = "$before" ]; then
            echo "::notice::the push left the version at $pushed; nothing to release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed != 'false'
        with:
          node-version: "22"
      - name: Find the version to release
        id: version
        if: steps.diff.outputs.changed != 'false'
        run: |
          pkg=packages/chrome-extension/package.json
          version="$(jq -r .version "$pkg")"
          tag="$TAG_PREFIX$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag exists; nothing to release"
            exit 0
          fi
          # Accepts a plain version or a semver prerelease such as 0.3.0-rc.1
          # that is higher than every earlier release. Tags hold no
          # whitespace, so the list splits into one argument each.
          # shellcheck disable=SC2046
          node packages/chrome-extension/scripts/release-version.mjs \
            $(git ls-remote --tags --refs origin "refs/tags/$TAG_PREFIX*" | sed "s|.*refs/tags/$TAG_PREFIX||") > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Pushing the manifest commit starts CI on main. The commit leaves
      # package.json alone, so it does not start this workflow again.
      - name: Commit the manifest version
        id: manifest
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          user_id="$(gh api "/users/$APP_SLUG[bot]" --jq .id)"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node packages/chrome-extension/scripts/sync-manifest-version.mjs
            # main already holds the version in manifest.json.
            if git diff --quiet; then break; fi
            git commit -q -m "chore(chrome-extension): set the manifest version to $VERSION" packages/chrome-extension/manifest.json
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not push the manifest commit to main after 3 attempts"
              exit 1
            fi
            # Another push reached main first. Start again from it rather
            # than rebase, which conflicts when it changed a line next to
            # the version.
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ "$(jq -r .version packages/chrome-extension/package.json)" != "$VERSION" ]; then
              echo "::notice::the version on main changed from $VERSION; the run for that push releases it"
              exit 0
            fi
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tag the commit
        if: steps.manifest.outputs.sha != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.manifest.outputs.sha }}
        run: |
          git tag -a "$TAG" -m "chrome-extension ${TAG#"$TAG_PREFIX"}" "$SHA"
          git push origin "refs/tags/$TAG"
