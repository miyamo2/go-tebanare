name: ci

on:
  # Pull requests stacked on other pull requests run CI once they target main
  # or a develop/* branch.
  pull_request:
    branches: [main, "develop/*"]
  # release-chrome-extension.yml runs all of CI on the tag before it creates
  # the release.
  workflow_call:

permissions:
  contents: read

env:
  # Bumping this fails TestCorpusSnapshot until
  # internal/presets/testdata/corpus_snapshot.json is rewritten with -update.
  GO_VERSION: "1.26.8"
  TINYGO_VERSION: "0.42.0"
  NODE_VERSION: "22"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fmt-check vet
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: dev
      # -short skips TestCorpusSnapshot. It parses GOROOT/src on one
      # goroutine, and -race makes it take 21s instead of 2s. The next step
      # runs it without -race.
      - run: go test -race -short ./...
      - run: go test -run '^TestCorpusSnapshot$' ./internal/presets
      # Regenerates packages/engine/src/generated from the Go declarations
      # and fails when the result differs from the committed files or when a
      # generated file is untracked.
      - run: make constants-check
      - run: make schema-check
      # The parity, ts, and e2e jobs wait for the wasm job, so this build
      # runs here.
      - run: make wasm-wasip1

  # The fuzzers run in their own job, alongside the go job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fuzz-smoke FUZZTIME=10s
      # The fuzz-wasm job replays what the fuzzers collected through engine.wasm.
      - run: make fuzz-vectors FUZZ_VECTORS="$RUNNER_TEMP/fuzz-vectors"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-vectors
          path: ${{ runner.temp }}/fuzz-vectors
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install TinyGo
        run: |
          wget -q "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i "tinygo_${TINYGO_VERSION}_amd64.deb"
          tinygo version
          echo "TINYGO_CACHE=$(tinygo env GOCACHE)" >> "$GITHUB_ENV"
      # TinyGo names each entry in its build cache by a hash of the entry's
      # inputs, so an old cache cannot serve a changed package.
      - name: Restore the TinyGo build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TINYGO_CACHE }}
          key: tinygo-build-${{ env.TINYGO_VERSION }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum', '**/*.go', 'build/tinygo/**') }}
          restore-keys: |
            tinygo-build-${{ env.TINYGO_VERSION }}-go${{ env.GO_VERSION }}-
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make wasm wasm-check
      - uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine/wasm/engine.wasm
          if-no-files-found: error

  fuzz-wasm:
    needs: [fuzz, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine/wasm
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-vectors
          path: ${{ runner.temp }}/fuzz-vectors
      - run: bun install --frozen-lockfile
      - name: Replay the fuzz corpus through engine.wasm
        run: |
          GOTEBANARE_FUZZ_VECTORS="$RUNNER_TEMP/fuzz-vectors" \
            bun run --cwd packages/engine vitest run test/fuzz-replay.test.ts

  parity:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine/wasm
      - run: bun install --frozen-lockfile
      - name: Compare the native and wasm results on the Go standard library
        run: make parity TMPDIR="$RUNNER_TEMP"
      - name: Compare them again with declarations paired across files
        run: make parity TMPDIR="$RUNNER_TEMP" PARITY_FLAGS=-pairs

  ts:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine/wasm
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run --filter @go-tebanare/chrome-extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: packages/chrome-extension/dist.zip
          if-no-files-found: error

  # Runs the built extension on the sample pull request
  # miyamo2/go-tebanare-sample#1 on github.com, signed in as the account in
  # the secrets E2E_GH_USER, E2E_GH_PASSWORD, and E2E_GH_TOTP_SECRET (the
  # setup key of its authenticator app).
  e2e:
    needs: wasm
    # Pull requests from forks and Dependabot get no secrets.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    # One sign-in at a time for the account. GitHub keeps one pending run per
    # group, so a newer run cancels a pending one.
    concurrency:
      group: e2e-github-account
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine/wasm
      - run: bun install --frozen-lockfile
      - name: Find the Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(jq -r '.devDependencies["@playwright/test"]' packages/chrome-extension/package.json)" >> "$GITHUB_ENV"
      # This caches the browsers. The install step below still installs
      # their system packages.
      - name: Restore the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: bun run --cwd packages/chrome-extension playwright install --with-deps chromium
      # This job uploads no traces, screenshots, or session file: they would
      # carry the account's session cookies or name.
      - name: Run the end-to-end tests
        env:
          E2E_GH_USER: ${{ secrets.E2E_GH_USER }}
          E2E_GH_PASSWORD: ${{ secrets.E2E_GH_PASSWORD }}
          E2E_GH_TOTP_SECRET: ${{ secrets.E2E_GH_TOTP_SECRET }}
          E2E_GH_AUTH_STATE: ${{ runner.temp }}/e2e/github.json
        run: bun run --cwd packages/chrome-extension e2e
