name: ci

on:
  push:
    branches: [main]
  # Pull requests stacked on other pull requests run CI once they target main.
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Bumping this fails TestCorpusSnapshot until
  # internal/presets/testdata/corpus_snapshot.json is rewritten with -update.
  GO_VERSION: "1.26.8"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fmt-check vet
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - run: go test -race ./...
      - run: make fuzz-smoke FUZZTIME=10s
