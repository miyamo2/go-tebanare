version: 1
rules:
  - id: repo-save
    func: "func (*Repository[T]) Save(context.Context, T) error"
  - id: map
    func: "func Map[T, U any]([]T, func(T) U) []U"
  - id: must
    func: "func Must[T](T, error) T"
  - id: constructors
    func: "func New*"
  - id: pair
    func: "func Pair[T, U comparable](T, U)"
